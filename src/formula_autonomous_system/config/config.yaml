# Formula Autonomous System Configuration
# Combined configuration file for all subsystems
# Author: Jiwon Seok (jiwonseok@hanyang.ac.kr)
# Date: 2025-07-25

system:
  visualization:
    enable_visualization: true # Enable or disable all ROS and OpenCV visualizations
  logging:
    enable_logging: true # Enable or disable data logging

perception:
  # ===========================================
  # LiDAR Perception Parameters
  # ===========================================
  
  lidar_roi_extraction:
    # LiDAR ROI extraction parameters
    x_min: 1.0
    x_max: 15.0
    y_min: -10.0
    y_max: 10.0
    z_min: -5.0
    z_max: 10.0

  lidar_ground_removal:
    # RANSAC ground plane fitting parameters
    ransac_iterations: 30
    ransac_distance_threshold: 0.01

  lidar_clustering:
    # DBSCAN clustering parameters
    dbscan_eps: 0.7
    dbscan_min_points: 2

  lidar_extrinsics:
    # LiDAR position relative to vehicle base (meters, degrees)
    translation_x: 0.6
    translation_y: 0.0
    translation_z: 0.1
    rotation_roll: 0.0
    rotation_pitch: 0.0
    rotation_yaw: 0.0

  # ===========================================
  # Camera Parameters
  # ===========================================

  camera_intrinsics:
    # Camera intrinsic parameters (pixels)
    # 640x480, horizontal FOV: 90 deg: focal length = 320.0
    focal_length_x: 320.0
    focal_length_y: 240.0
    principal_point_x: 320.0
    principal_point_y: 240.0

  camera_extrinsics:
    # Camera position relative to vehicle base (meters, degrees)
    translation_x: -0.43
    translation_y: -0.15
    translation_z: 0.82
    rotation_roll: 0.0
    rotation_pitch: 0.0
    rotation_yaw: 0.0

  camera_right_extrinsics:
    # Camera position relative to vehicle base (meters, degrees)
    translation_x: -0.43
    translation_y: 0.15
    translation_z: 0.82
    rotation_roll: 0.0
    rotation_pitch: 0.0
    rotation_yaw: 0.0

  camera_image_processing:
    # Image preprocessing settings
    enable_preprocessing: true
    gaussian_blur_sigma: 1.0
    bilateral_filter_diameter: 9
    color_score_separation_threshold: 1.5 # The best color score must be X times higher than the second best

  camera_hsv_window_size:
    base_size: 20 # Base window size in pixels at 0 distance
    distance_factor: 0.3 # Pixels to add to half-size per meter of distance

  camera_hsv_yellow:
    # HSV thresholds for yellow cone detection
    hue_min: 18
    hue_max: 40
    saturation_min: 20
    value_min: 80

  camera_hsv_blue:
    # HSV thresholds for blue cone detection
    hue_min: 90
    hue_max: 110
    saturation_min: 90
    value_min: 100

  camera_hsv_orange:
    # HSV thresholds for orange cone detection
    hue_min: 10
    hue_max: 20
    saturation_min: 100
    value_min: 100

  camera_cone_detection:
    min_bbox_area: 300 # Minimum bounding box area (pixels) to consider for detection
    visualize_lidar_on_camera: true # Whether to visualize projected LiDAR points on camera images
    lidar_cam_iou_threshold: 0.5 # Minimum IoU between LiDAR window and camera bbox for a match

localization:
  # ===========================================
  # Localization Parameters
  # ===========================================
  
  localization:
    # Reference WGS84 Position
    # if user defined position is true then use ref_wgs84_latitude, ref_wgs84_longitude, ref_wgs84_altitude
    # if not then use initial gps position as reference position
    use_user_defined_ref_wgs84_position: true
    ref_wgs84_latitude: 47.641467991978416
    ref_wgs84_longitude: -122.14016501105924
    ref_wgs84_altitude: 0.0
    
    # Velocity Estimation
    alpha_velocity: 0.1 # Reduced to 0 to eliminate lag
    yaw_filter_alpha : 0.4 # Reduced to make fused yaw smoother

local_planning:
  trajectory:
    lane_offset: 3.0
    planner_roi_distance : 10.0
    planner_roi_angle : 80.0
    planner_clustering_eps : 4.0

mapping:
  association_threshold: 1.5 # Distance threshold for associating cones
  smoothing_alpha: 0.2 # Weight for new cone observations
  lc:
    min_cones: 20 # Minimum number of cones in map to attempt loop closure
    trigger_distance: 8.0 # Distance to start line to trigger LC check
    search_radius: 15.0 # Radius to search for cones around start/end points
    min_pairs: 5 # Minimum number of matching cone pairs required for transform
    max_error: 0.75 # Maximum allowed average error for transform
    cooldown_updates: 100 # Number of updates to wait after a successful LC

planning:
  path_planner:
    max_edge_length: 7.0 # Max distance between connected midpoints in path planning
    path_obstacle_threshold: 0.5 # Minimum clearance distance for a path segment to be valid
    weight_dist: 0.3
    weight_angle: 0.7
    max_path_distance: 100.0 # Max distance for the planned path
    spline_smoothing_factor: 1.0 # Smoothing factor for path spline
    fallback_path_length: 15.0 # Length of the fallback path in meters
    fallback_path_points: 10 # Number of points in the fallback path

control:
  ControllerSelection:
    # lateral_controller_type: "PurePursuit", "Stanley", "MPC", "MPC_SciPy"
    lateral_controller_type: "MPC_SciPy" 

  PurePursuit:
    lookahead_distance: 1.0

  Stanley:
    k_gain: 1.1

  MPC:
    horizon: 5
    dt: 0.1
    speed_dependent_weights:
      - max_speed: 8.0 # Low speed, sharp corners
        weights:
          w_cte: 500.0
          w_etheta: 200.0
          w_vel: 30.0
          w_steer: 10.0
          w_accel: 50.0
          w_steer_rate: 100.0
          w_accel_rate: 50.0
      - max_speed: 15.0 # Medium speed
        weights:
          w_cte: 300.0
          w_etheta: 200.0
          w_vel: 50.0
          w_steer: 30.0
          w_accel: 10.0
          w_steer_rate: 100.0
          w_accel_rate: 15.0
      - max_speed: 27.0 # High speed
        weights:
          w_etheta: 120.0
          w_vel: 100.0
          w_steer: 15.0
          w_accel: 15.0
          w_steer_rate: 100.0
          w_accel_rate: 30.0
    mpc_fallback_weights:
      w_cte: 500.0
      w_etheta: 300.0
      w_vel: 30.0
      w_steer: 6.0
      w_accel: 50.0
      w_steer_rate: 150.0
      w_accel_rate: 50.0

  SpeedControl:
    pid_kp: 0.5
    pre_loop_closure:
      target_speed: 10.0
      min_speed: 6.0 # 코너 최소 속도
      curvature_speed_factor: 15.0 # 곡률에 따른 감속 강도
      curvature_lookahead: 3 # 곡률 계산 시 참고할 포인트 거리
    post_loop_closure:
      target_speed: 15.0 # Target speed after loop closure
      min_speed: 8.0 # 코너 최소 속도 (더 공격적인 코너링을 위해 낮춤)
      curvature_speed_factor: 15.0 # 곡률에 따른 감속 강도 (더 공격적인 코너링을 위해 낮춤)
      curvature_lookahead: 3 # 곡률 계산 시 참고할 포인트 거리

  Vehicle:
    wheel_base: 1.55
    max_accel : 0.5
    min_accel : -0.5

  SideSlipControl:
    enable: false
    slip_angle_threshold: 0.2 # radians (approx 5.7 degrees)
    speed_reduction_factor: 0.5 # Reduce target speed to 80%

  CurvatureWeightTuning:
    enable: false
    # 튜닝 효과를 최대로 받을 곡률 값 (이 값을 넘는 곡률에서는 최대치로 적용)
    max_curvature_for_tuning: 0.5
    # 곡률이 커질수록 w_cte 가중치를 얼마나 더 증가시킬지 결정하는 계수
    cte_factor: 1.5
    # 곡률이 커질수록 w_steer 가중치를 얼마나 더 감소시킬지 결정하는 계수
    steer_factor: 1.1
        # 곡률이 커질수록 w_steer_rate 가중치를 얼마나 더 감소시킬지 결정하는 계수
    steer_rate_factor: 1.2
    
  AdvancedCurvatureTuning:
    enable: false
    # 비선형적 곡률 반응을 위한 지수 (1.0 = 선형, >1.0 = 곡률이 클수록 더 강하게 반응)
    curvature_power: 0.8
    # 곡률에 따른 헤딩 오차(etheta) 가중치 증가 계수
    etheta_factor: 0.9
    # 저속에서 곡률 튜닝의 영향을 줄이는 속도 계수 (0~1, 1에 가까울수록 속도 영향 큼)
    speed_influence_factor: 0.3